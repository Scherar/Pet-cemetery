name: Container-Image bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image-Namen kleinschreiben
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Bauen (lokal, für den Test)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: pet-cemetery:test

      - name: Startet der Container?
        run: |
          docker run -d --name t -p 3000:3000 -e APP_URL=http://localhost:3000 pet-cemetery:test
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ || true)
            [ "$code" = "200" ] && echo "Startseite 200" && exit 0
            sleep 2
          done
          docker logs t
          exit 1

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
