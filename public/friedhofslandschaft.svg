    <path d="M-35 699C118 661 216 725 356 735s204-37 324-70 207-62 319-43 168 45 236 33" stroke="#77b8d0" stroke-width="76"/>
    <path d="M-35 699C118 661 216 725 356 735s204-37 324-70 207-62 319-43 168 45 236 33" stroke="#a7d9e8" stroke-width="56"/>
    <path d="M-35 683C112 650 226 704 354 713s205-38 325-70 213-60 322-42 164 44 233 29" stroke="#c7e8ee" stroke-width="5" opacity=".62"/>
  </g>

  <!-- Open, curved paths; broad margins leave lawn pockets for later additions -->
  <g id="paths" fill="none" stroke="#e9dfbd" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-24 463C138 421 258 399 382 414s179 57 301 46c124-11 215-70 353-39 67 15 119 39 190 30" stroke-width="34"/>
    <path d="M116 827c45-106 117-159 217-190 125-39 230-23 327-68 105-49 145-132 265-138 99-5 156 46 209 92" stroke-width="38"/>
    <path d="M223 401c39-70 103-104 194-110 114-8 184 29 291 12 111-18 166-82 273-73" stroke-width="31"/>
    <path d="M500 816c22-69 79-101 160-113 85-13 145 16 219-4 69-19 113-66 167-86" stroke-width="29"/>
    <path d="M-30 463C138 421 258 399 382 414s179 57 301 46c124-11 215-70 353-39 67 15 119 39 190 30" stroke="#f5edda" stroke-width="3" opacity=".55"/>
  </g>

  <!-- Tree groups around the perimeter, with uncluttered central lawn -->
  <g id="trees">
    <use xlink:href="#tree" transform="translate(106 232) scale(1.02)"/>
    <use xlink:href="#smallTree" transform="translate(276 177) scale(.88)"/>
    <use xlink:href="#tree" transform="translate(469 231) scale(.92)"/>
