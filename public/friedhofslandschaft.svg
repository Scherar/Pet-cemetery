<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Friedhofslandschaft – bearbeitbare Vektorgrundlage</title>
  <desc id="desc">Freundliche, stilisierte Landschaft aus grünen Rasenflächen, geschwungenen hellbeigen Wegen, einem blauen Bach und lockeren Baumgruppen. Ohne Gräber, Personen oder Beschriftung.</desc>
  <defs>
    <g id="tree">
      <path d="M-7 18h14v28a4 4 0 0 1-4 4h-6a4 4 0 0 1-4-4z" fill="#805b3d"/>
      <circle cx="0" cy="-5" r="25" fill="#4f8d5b"/>
      <circle cx="-17" cy="4" r="18" fill="#5d9d68"/>
      <circle cx="17" cy="4" r="18" fill="#5d9d68"/>
    </g>
    <g id="smallTree">
      <path d="M-5 14h10v22a3 3 0 0 1-3 3h-4a3 3 0 0 1-3-3z" fill="#805b3d"/>
      <circle cy="-5" r="20" fill="#4f8d5b"/>
      <circle cx="-13" cy="2" r="15" fill="#67a773"/>
      <circle cx="13" cy="2" r="15" fill="#67a773"/>
    </g>
  </defs>

  <!-- Base meadow and gently rolling lawn bands -->
  <g id="meadow">
    <rect width="1200" height="800" fill="#a6cda0"/>
    <path d="M0 172C176 117 353 192 533 173c213-23 424-120 667-8v635H0z" fill="#9bc597"/>
    <path d="M0 646c193-67 367-57 564-30 220 30 391-35 636 24v160H0z" fill="#8fbc8b"/>
    <path d="M0 297c119-40 206-18 296 5 104 27 177 19 268-15 124-46 243-38 356 9 101 42 172 37 280 2v72H0z" fill="#a1c99b" opacity=".55"/>
  </g>

