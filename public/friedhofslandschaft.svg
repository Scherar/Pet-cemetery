    <use xlink:href="#smallTree" transform="translate(83 390) scale(.9)"/>
    <use xlink:href="#tree" transform="translate(1129 445) scale(.88)"/>
    <use xlink:href="#tree" transform="translate(168 568) scale(.96)"/>
